{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Study Desk{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <div class="desk">
        <header class="toolbar">
            <a href="{% url 'home' %}" class="brand">
                <span class="brand-mark">SD</span>
                <span class="brand-name">Study Desk<span class="accent-dot">.</span></span>
            </a>
            <nav class="toolbar-nav">
                <a href="{% url 'home' %}">Library</a>
                <a href="{% url 'upload' %}">Upload</a>
            </nav>
        </header>

        <main class="page">
            {% if messages %}
                <ul class="flash-list">
                    {% for message in messages %}
                        <li class="flash flash-{{ message.tags }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            {% block content %}{% endblock %}
        </main>

        <footer class="desk-footer">
            <span>Study Desk &mdash; LangChain + Gemini Flash learning agent</span>
        </footer>
    </div>
</body>
</html>
